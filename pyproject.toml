[project]
name = "mas-crawler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hariton", email = "163732857+haritonn@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mas-crawler = "mas_crawler:main"

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "core/Cargo.toml"
python-source = "src"
module-name = "mas_crawler._native"
features = ["python", "pyo3/extension-module"]
