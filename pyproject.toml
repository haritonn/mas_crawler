[project]
name = "mas-crawler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hariton", email = "163732857+haritonn@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "ir-measures>=0.4.3",
    "langchain",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langsmith",
    "numpy>=2.5.4",
    "pydantic",
    "pytest",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20,<2",
    "sentence-transformers>=6.2,<7",
    "transformers",
    "uvicorn>=0.54.0",
]

[project.scripts]
mas-crawler = "mas_crawler.cli:main"
mas-crawler-web = "mas_crawler.web.app:main"

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "core/Cargo.toml"
python-source = "src"
module-name = "mas_crawler._native"
features = ["python", "pyo3/extension-module"]
include = [
    { path = "templates/search-service/README.md", format = ["sdist", "wheel"] },
    { path = "templates/search-service/Dockerfile", format = ["sdist", "wheel"] },
    { path = "templates/search-service/.dockerignore", format = ["sdist", "wheel"] },
    { path = "templates/search-service/.gitignore", format = ["sdist", "wheel"] },
    { path = "templates/search-service/pyproject.toml", format = ["sdist", "wheel"] },
    { path = "templates/search-service/uv.lock", format = ["sdist", "wheel"] },
    { path = "templates/search-service/native/Cargo.*", format = ["sdist", "wheel"] },
    { path = "templates/search-service/native/src/*.rs", format = ["sdist", "wheel"] },
    { path = "templates/search-service/src/search_service/*.py", format = ["sdist", "wheel"] },
    { path = "templates/search-service/tests/*.py", format = ["sdist", "wheel"] },
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
