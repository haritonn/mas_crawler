[package]
name = "mas-crawler-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
reqwest = "0.13.5"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
