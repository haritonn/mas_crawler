[project]
name = "search-service"
version = "0.1.0"
description = "Standalone editable BM25 search service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0,<1",
    "pydantic>=2.14.1,<3",
    "uvicorn>=0.54.0,<1",
]

[project.scripts]
search-service = "search_service.cli:main"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "search_service._native"
features = ["pyo3/extension-module"]
locked = true

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.1,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
